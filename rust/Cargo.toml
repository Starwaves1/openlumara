[workspace]
resolver = "2"
members = [
    "crates/ol-core",
    "crates/ol-modules",
    "crates/ol-modules-data",
    "crates/ol-modules-web",
    "crates/ol-modules-dev",
    "crates/ol-channels",
    "crates/ol-channels-chat",
    "crates/ol-webui",
    "crates/openlumara",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
ol-core = { path = "crates/ol-core" }
ol-modules = { path = "crates/ol-modules" }
ol-channels = { path = "crates/ol-channels" }
ol-modules-data = { path = "crates/ol-modules-data" }
ol-modules-web = { path = "crates/ol-modules-web" }
ol-modules-dev = { path = "crates/ol-modules-dev" }
ol-channels-chat = { path = "crates/ol-channels-chat" }
ol-webui = { path = "crates/ol-webui" }

tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures = "0.3"
async-trait = "0.1"
async-stream = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
rmp-serde = "1.3"
indexmap = { version = "2", features = ["serde"] }
parking_lot = "0.12"
once_cell = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
ulid = "1"
md-5 = "0.10"
sha2 = "0.10"
hmac = "0.12"
anyhow = "1"
thiserror = "2"
shlex = "1"
base64 = "0.22"
infer = "0.16"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls", "multipart"] }
url = "2"
percent-encoding = "2"
rand = "0.8"
walkdir = "2"
tempfile = "3"
